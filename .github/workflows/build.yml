name: Build Vid Klipzo Pro APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Setup Android Project
        run: |
          flutter create --project-name vid_klipzo_pro temp_app
          cp -r temp_app/android ./android
          rm -rf temp_app
      - name: Build APK
        run: |
          flutter pub get
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/proguard-android\.txt/proguard-android-optimize\.txt/g' {} + || true
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vid-Klipzo-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
